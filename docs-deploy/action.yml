name: Deploy docs to GitHub Pages
description: Build and deploy documentation to GitHub Pages using remote-astro-theme.

outputs:
  page_url:
    description: The URL of the deployed GitHub Pages site.
    value: ${{ steps.deployment.outputs.page_url }}

inputs:
  node-version:
    description: 'The Node.js version to use for building the docs.'
    required: false
    default: '24'

  docs-path:
    description: 'The path to the documentation files.'
    required: false
    default: 'docs'
  
  version:
    description: 'The version of the remote-astro-theme to install.'
    required: false
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Write build metadata
      shell: bash
      env:
        DOCS_PATH: ${{ inputs.docs-path }}
        BUILD_REPO: ${{ github.repository }}
        BUILD_REF: ${{ github.ref_name }}
        BUILD_SHA: ${{ github.sha }}
      run: |
        mkdir -p "$DOCS_PATH/public"
        printf 'Build from %s\nRef: %s\nCommit: %s\n' "$BUILD_REPO" "$BUILD_REF" "$BUILD_SHA" > "$DOCS_PATH/public/version.txt"

    - name: Build docs
      shell: bash
      env:
        DOCS_PATH: ${{ inputs.docs-path }}
        THEME_VERSION: ${{ inputs.version }}
      run: npx --yes --package "@mindovermachine-dev/remote-astro-theme@$THEME_VERSION" remote-astro-theme build --dir "$DOCS_PATH"

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Upload docs artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
